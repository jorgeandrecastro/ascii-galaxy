[package]
name          = "ascii-galaxy"
version       = "0.1.1"
edition       = "2024"
authors       = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
license       = "MIT"
description   = "Un convertisseur d'image en art ASCII haute performance pour personnaliser les intros de terminal."
repository    = "https://github.com/jorgeandrecastro/ascii-galaxy"
readme        = "README.md"
keywords      = ["ascii", "art", "cli", "terminal", "image"]
categories    = ["command-line-utilities", "graphics"]

[[bin]]
name = "ascii-galaxy"
path = "src/main.rs"

[dependencies]
image = "0.25"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip = true